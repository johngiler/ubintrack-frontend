##
## Catch-all: hosts sin vhost dedicado en este servidor.
## Instalar una vez en webapp:
##   cp 000-default-unconfigured.conf /etc/nginx/sites-available/
##   ln -sf /etc/nginx/sites-available/000-default-unconfigured.conf /etc/nginx/sites-enabled/
##   nginx -t && systemctl reload nginx
##
## Los vhosts con server_name explícito (rbcold.ubintrack.com, etc.) siguen
## teniendo prioridad. Este bloque solo atiende dominios no configurados.
##

# HTTP — dominio desconocido
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 404 "No nginx vhost configured for this host.\n";
    }
}

# HTTPS — rechaza TLS si no hay vhost/cert para ese host (nginx >= 1.19.4)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
