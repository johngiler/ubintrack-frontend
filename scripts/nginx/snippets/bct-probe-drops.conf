# Shared probe drops for BCT webapp vhosts (include inside server { }).
# Install on webapp:
#   sudo cp frontend/scripts/nginx/snippets/bct-probe-drops.conf /etc/nginx/snippets/
#   sudo cp frontend/scripts/nginx/conf.d/webapp-maps.conf /etc/nginx/conf.d/
# Then in each HTTPS server block (before location /):
#   include /etc/nginx/snippets/bct-probe-drops.conf;

server_tokens off;

# Scanner / abuse user-agents (map in conf.d/webapp-maps.conf).
if ($webapp_drop_ua) {
    return 444;
}

# Dotfiles / VCS / secrets never served by Next fronts.
location ~* (^|/)\.(env|git|svn|hg|htaccess|htpasswd)(/|$) {
    return 444;
}

# CMS / PHP / RCE / actuator probes.
location ~* (phpunit|eval-stdin\.php|wp-admin|wp-login|wp-config|xmlrpc\.php|cgi-bin|vendor/phpunit|phpinfo(?:\.php)?|actuator/(?:env|health|configprops)|server-status) {
    return 444;
}
